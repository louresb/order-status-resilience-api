name: .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OrderStatusResilience.sln

      - name: Build solution
        run: dotnet build OrderStatusResilience.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test OrderStatusResilience.sln --configuration Release --no-build
